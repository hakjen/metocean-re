# Built-in turbine types.
#
# Each section is one turbine. Units:
#   rated_power     MW
#   cut_in          m/s   wind speed where the turbine starts producing
#   rated_speed     m/s   wind speed where rated power is reached
#   cut_out         m/s   wind speed where the turbine shuts down
#   hub_height      m     above mean sea level
#   rotor_diameter  m
#
# You can write your own file in the same format and load it with
# wind_energy.turbines.load("my_turbines.cfg").

# Source: Jonkman, J., Butterfield, S., Musial, W., Scott, G. (2009).
# Definition of a 5-MW Reference Wind Turbine for Offshore System
# Development. NREL/TP-500-38060, Table 1-1, p. 2.
[NREL-5MW]
rated_power = 5.0
cut_in = 3.0
rated_speed = 11.4
cut_out = 25.0
hub_height = 90.0
rotor_diameter = 126.0
description = NREL 5 MW reference turbine

# Source: Bak, C. et al. (2013). Description of the DTU 10 MW Reference
# Wind Turbine. DTU Wind Energy Report-I-0092, Table 2.1, p. 13.
[DTU-10MW]
rated_power = 10.0
cut_in = 4.0
rated_speed = 11.4
cut_out = 25.0
hub_height = 119.0
rotor_diameter = 178.3
description = DTU 10 MW reference turbine

# Source: Gaertner, E. et al. (2020). Definition of the IEA Wind
# 15-Megawatt Offshore Reference Wind Turbine. NREL/TP-5000-75698,
# Table 1-1, p. 5.
[IEA-15MW]
rated_power = 15.0
cut_in = 3.0
rated_speed = 10.59
cut_out = 25.0
hub_height = 150.0
rotor_diameter = 240.0
description = IEA Wind 15 MW offshore reference turbine
